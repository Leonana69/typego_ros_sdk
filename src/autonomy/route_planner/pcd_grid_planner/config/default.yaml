pcd_grid_planner:
  ros__parameters:
    map_frame: map

    map_voxel_size: 0.08
    grid_resolution: 0.20
    grid_padding: 0.2
    grid_max_cells: 2000000
    grid_min_support_points: -1            # -1 → derive from voxel/cell ratio
    grid_min_support_fill: 0.20            # fill fraction used when auto-deriving

    max_slope_deg: 25.0
    max_step_height: 0.18

    min_clearance: 0.35
    obstacle_height: 0.15
    vehicle_height: 1.0
    line_clearance: -1.0                   # -1 → clearance_radius - grid_resolution

    start_snap_radius: 6.0
    goal_snap_radius: 2.0
    lookahead_distance: 2.5
    waypoint_reach_radius: 0.6
    goal_tolerance: 0.35
    waypoint_rate: 5.0
    smoothing_enabled: true                # greedy line-of-sight compaction post-A*
    publish_debug_markers: false           # /pcd_2d_map already shows the grid in RViz

    # Live obstacle layer (rasterized from /terrain_map).
    live_layer_enabled: true
    live_topic: "/terrain_map"
    live_timeout_sec: 6.0            # FRESH→STALE at half, STALE→CLEAR at full
    live_input_timeout_sec: 3.0      # if input silent for >this, drop live layer
    live_decay_rate_hz: 2.0
    live_publish_rate_hz: 5.0
    stale_step_penalty: 1.0          # extra A* cost multiplier for STALE cells

    replan_period_sec: 0.5
    replan_horizon_m: 4.0
    max_replan_attempts: 20
