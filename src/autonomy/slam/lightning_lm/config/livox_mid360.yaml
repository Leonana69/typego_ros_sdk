# lightning-lm config for the typego autonomy stack (Livox MID360 + IMU on go2/kami).
# Derived from upstream config/default_livox.yaml; only the values the typego
# stack actually depends on are tuned here. Anything not set falls back to
# upstream defaults via slam.cc / laser_mapping.cc.

common:
  dataset: "typego"
  # lightning's generic PointCloud2 handler only knows Ouster/Velodyne/RoboSense
  # (no Livox PointCloud2 case), so we consume the CustomMsg path instead.
  # The workspace driver publishes typego_interface/CustomMsg on /livox/lidar_custom;
  # the typego_to_livox_bridge.py helper republishes it as livox_ros_driver2/CustomMsg
  # on /lightning/livox_custom, which lightning subscribes to here.
  lidar_topic: ""
  livox_lidar_topic: "/lightning/livox_custom"
  imu_topic: "/livox/imu"

# fasterlio front-end
fasterlio:
  lidar_type: 1                        # 1 = Livox
  scan_line: 4                         # MID360 has 4 lines (matches arise_slam)
  blind: 0.1
  time_scale: 1e-3
  skip_lidar_num: 0
  # Keep every point so /registered_scan density matches arise_slam.
  # The voxel filter (filter_size_scan) still downsamples internally for ICP.
  point_filter_num: 1
  max_iteration: 4
  filter_size_scan: 0.5
  filter_size_map: 0.5
  ivox_grid_resolution: 0.5
  ivox_nearby_type: 18
  esti_plane_threshold: 0.1
  use_aa: false
  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  extrinsic_est_en: false
  extrinsic_T: [ 0, 0, 0.0 ]          # IMU and lidar on MID360 are co-located
  extrinsic_R: [ 1, 0, 0,
                 0, 1, 0,
                 0, 0, 1 ]
  keep_first_imu_estimation: false
  kf_dis_th: 1.0
  kf_angle_th: 10.0
  enable_icp_part: false
  plane_icp_weight: 300.0
  min_pts: 500
  imu_filter: false
  proj_kfs: false

# Outputs — read by our patched SlamSystem (see UPSTREAM.md, patch 3).
# Topic names here match what arise_slam's imu_preintegration publishes
# (NOT laser_mapping's /integrated_to_init, which is an internal arise topic
#  that nothing downstream actually subscribes to). The autonomy stack —
# terrain_analysis, local_planner, sensor_scan_generation, visualization_tools,
# tare_planner via /state_estimation_at_scan — all read /state_estimation.
outputs:
  odom_topic: "/state_estimation"
  cloud_topic: "/registered_scan"
  world_frame: "map"
  sensor_frame: "sensor"
  publish_tf: true
  # Lightning snaps kf_imu_ to kf_ after each lidar tick (laser_mapping.cc:311),
  # which shows up as base_link jitter when we publish at IMU rate. Default off:
  # lidar-rate (~10 Hz) publish only. Flip to true to compare; you'll get
  # roughly arise's ~50 Hz but with visible snaps every lidar tick.
  publish_at_imu_rate: false

g2p5:
  esti_floor: false
  lidar_height: 0.0
  floor_height: -1.2
  min_th_floor: 0.50
  max_th_floor: 1.0
  grid_map_resolution: 0.2

system:
  with_loop_closing: true
  with_ui: false                       # headless on Jetson
  with_2dui: false
  with_g2p5: false                     # typego stack builds its own occupancy map
  step_on_kf: false
  enable_lidar_loc_skip: false
  enable_lidar_loc_rviz: false
  enable_lidar_odom_skip: false
  evaluation: false
  lidar_loc_skip_num: 4
  lidar_odom_skip_num: 2
  map_path: ./data/new_map/
  pub_tf: true

loop_closing:
  loop_kf_gap: 20
  min_id_interval: 20
  closest_id_th: 50
  max_range: 20.0
  ndt_score_th: 1.3
  with_height: false

# Localization section — kept at upstream defaults; only used when running the
# `run_loc_online` executable. The typego stack currently uses `run_slam_online`.
lidar_loc:
  enable_dynamic_polygon: false
  enable_parking_static: true
  enable_icp_adjust: false
  filter_intensity_max: 100.0
  filter_intensity_min: 10.0
  filter_z_max: 30.0
  filter_z_min: -1.0
  force_2d: false
  grid_search_angle_range: 180.0
  grid_search_angle_step: 60
  lidar_loc_odom_th: 0.5
  init_with_fp: true
  min_init_confidence: 1.8
  update_dynamic_cloud: false
  update_err_h: 0.2
  update_err_v: 0.2
  update_kf_dis: 2.0
  update_lidar_loc_score: 2.5
  loc_on_kf: true
  try_self_extrap: false
maps:
  delete_when_unload: false
  dyn_cloud_policy: persistent
  load_dyn_cloud: true
  load_map_size: 2
  max_pts_dyn_chunk: 100000
  save_dyn_when_quit: true
  save_dyn_when_unload: false
  unload_map_size: 4
  with_dyn_area: false
pgo:
  dr_ang_noise: 0.5
  dr_pos_noise: 1.0
  dr_pos_noise_ratio: 1.0
  lidar_loc_ang_noise: 1.0
  lidar_loc_outlier_th: 5.0
  lidar_loc_pos_noise: 0.3
  lidar_odom_ang_noise: 1.0
  lidar_odom_pos_noise: 0.3
  pgo_frame_converge_ang_th: 1.0
  pgo_frame_converge_pos_th: 0.05
  rtk_fix_ang_noise: 2.0
  rtk_fix_pos_noise: 1.0
  rtk_height_noise_ratio: 10.0
  rtk_other_ang_noise: 10.0
  rtk_other_pos_noise: 5.0
  rtk_outlier_th: 1.0
  smooth_factor: 0.01
roi:
  # Upstream defaults (height_min: 0.5, range_min: 3.0) are tuned for a car
  # mounted with the lidar high on the roof. For a quadruped indoors, the
  # ground is ~0.4 m *below* the lidar, so height_min: 0.5 drops the entire
  # floor and low obstacles, and range_min: 3.0 blinds the robot in close
  # quarters. Loosen both. blind in the fasterlio block (0.1 m) still rejects
  # self-points.
  height_max: 10.0
  height_min: -2.0
  range_max: 70
  range_min: 0.1
ui:
  car_length: 2.0
  car_width: 1.6
  car_height: 1.7
  scans: 1
