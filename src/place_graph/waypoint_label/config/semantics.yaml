# Parameters for the semantic_labeler node. Kept here (not in typego_config)
# because typego_config's pydantic schema forbids unknown fields.
/**:
  ros__parameters:
    camera_topic: /camera/color/image_raw
    map_frame: map
    base_frame: base_link

    # VLM backend: the qwenvl multipart gateway (POST /process). Leave empty to
    # use robot.yaml's network.edge_service (the launch file passes it in, and
    # the node also reads $EDGE_SERVICE_IP/$EDGE_SERVICE_PORT). Set a full URL
    # here only to point at a different host; "/process" is appended if absent.
    vlm_endpoint: ''
    vlm_robot_info: place_graph_labeler   # client id for the gateway's rate bucket
    vlm_max_new_tokens: 512               # gateway clamps to 1..4096
    vlm_temperature: 0.0                  # gateway clamps to 0..2

    # Capture + selection
    frame_hz: 2.0          # max kept camera frames per second
    max_image_px: 1024     # longest edge of the montage sent to the VLM
    min_frames: 3          # frames needed in a region before labeling
    max_views: 4           # images sent per VLM call
    forward_dist_m: 2.0    # forward-ray bucketing distance ahead of the robot
    min_blur: 40.0         # variance-of-Laplacian floor (drop blurry frames)

    # Labeling policy
    conf_threshold: 0.4    # below this -> source "vlm_lowconf"
    label_period_s: 5.0    # labeling worker tick
    cooldown_s: 60.0       # min seconds between attempts on the same place
