# Single-source robot configuration. This file replaces docker/.env and
# the scattered launch-arg defaults. Edit once, relaunch the stack.
#
# STATIC MODEL: this file is read and validated once, at launch. The resolved
# configuration is immutable for the life of the run -- every parameter on the
# /typego_config node is read-only, and there is no reload service. To change
# anything, edit here and relaunch. `ros2 run typego_config typego-config
# dryrun` prints the fully resolved tree.
#
# An invalid file is fatal: typego_bringup refuses to launch rather than
# falling back to built-in defaults, because those defaults differ from the
# real vehicle geometry that local_planner's collision table is baked for.
#
# Sections:
#   robot       - identity (id / type / name)
#   autonomy    - 2d vs 3d autonomy + planner + SLAM backend
#   network     - DDS, robot IP, edge service, gstreamer
#   web_gateway - HMI server + bag recording
#   map         - which SLAM map to load
#   profiles    - which per-tool tuning YAML to use (Nav2 / SLAM / planners)
#   vehicle     - physical footprint
#   sensors     - sensor mounting offsets
#   motion      - speed / yaw limits
#
# Full key-by-key map of what each setting drives: doc/CONFIG.md
# Schema: typego_config.schema.RobotConfig (see JSON Schema via
#   `ros2 run typego_config typego-config schema`).

robot:
  id: ""             # namespace suffix; "" => no namespace
  type: go2          # go2 | kami
  name: robot-alpha

autonomy:
  type: 2d           # 2d (SLAM Toolbox + Nav2) | 3d (LIO + local planner)
  # planner: pcd_grid  # local | far | pcd_grid | exploration
  #   Only valid when type=3d -- 2D autonomy plans with Nav2, so anything
  #   other than 'local' is rejected here rather than silently ignored.
  #   Uncomment together with type: 3d.
  slam_backend: arise  # arise | lightning  (only used when type=3d)

network:
  ros_domain_id: 1
  rmw: rmw_cyclonedds_cpp
  fastdds_builtin_transports: UDPv4
  robot_ip: 192.168.0.163
  edge_service:
    ip: 192.168.0.104
    port: 50049
  gstreamer:
    interface: wlo1
    rgb_port: 1722
    depth_port: 1723
    audio_port: 1724

web_gateway:
  enabled: true
  host: 0.0.0.0
  port: 8080
  bag_dir: ~/.typego/bags
  bag_chunk_seconds: 600
  bag_retain: 6
  camera_topic: camera/color/image_raw   # gateway camera sub; "" disables

map:
  slam_map_name: empty_map
  init_pose_from_file: true

profiles:
  nav2_params_file: nav2_params.yaml      # under 2d_autonomy/config/
  slam_params_file: slam.yaml             # under 2d_autonomy/config/
  local_planner_profile: dog              # local_planner/config/<name>.yaml: dog | omniDir | standard
  far_planner_profile: outdoor            # far_planner/config/<name>.yaml: indoor | outdoor
  tare_planner_profile: indoor_small      # tare_planner/<name>.yaml: indoor_small | indoor_large | outdoor

# NOTE: the local_planner path-collision table (local_planner/paths/
# correspondences.txt) is baked for a fixed footprint. After changing
# length/width, regenerate it with local_planner/paths/path_generator.m
# (update the matching vehicleLength/vehicleWidth there) or path collision
# checking will not reflect the new size.
vehicle:
  length: 0.75              # m  footprint length  -> local_planner vehicleLength
  width: 0.4               # m  footprint width   -> local_planner vehicleWidth

sensors:
  lidar_offset_x: 0.30     # m  LiDAR X offset from base_link  -> sensorOffsetX
  lidar_offset_y: 0.0      # m  LiDAR Y offset from base_link  -> sensorOffsetY
  camera_offset_z: 0.25    # m  camera Z offset from base_link -> cameraOffsetZ

motion:
  max_speed: 1.375         # m/s   local-planner top speed        -> local_planner maxSpeed
  autonomy_speed: 0.875    # m/s   autonomy-mode cruise speed     -> local_planner autonomySpeed
  max_accel: 2.0           # m/s^2 local-planner accel ramp       -> local_planner maxAccel
  max_decel: 2.0           # m/s^2 local-planner braking ramp     -> local_planner maxDecel
  cmd_vel_max_linear: 0.8  # m/s   cmd_vel_controller clamp (vx & vy)
  cmd_vel_max_angular: 1.0 # rad/s cmd_vel_controller yaw clamp
  cmd_vel_min_angular: 0.2 # rad/s cmd_vel_controller yaw deadband floor
