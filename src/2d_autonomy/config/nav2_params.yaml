controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.05
    progress_checker_plugin: "progress_checker"
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1     # meters
      # Aggressive stuck detection: robot must move 0.1 m every 4 s or
      # FollowPath fails (was 10 s). Catches a blocked robot fast.
      movement_time_allowance: 4.0

    goal_checker_plugins: ["goal_checker"]
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.2      # (meters) Tighten XY tolerance
      yaw_goal_tolerance: 3.14      # (radians) Tighten angle tolerance
      stateful: false               # Prevents re-checking past goals

    controller_plugins: ["FollowPath"]    
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.4
      vy_std: 0.2
      # Widen angular control sampling so MPPI can explore hard turns in a
      # single cycle instead of slowly drifting the noise distribution toward
      # high wz over many control steps. Now exceeds vx_std so rotation is
      # explored at least as aggressively as forward speed.
      wz_std: 0.7
      vx_max: 1.5
      vx_min: -0.35
      vy_max: 0.5
      wz_max: 2.5
      ax_max: 10.0
      ax_min: -10.0
      ay_min: -3.0
      ay_max: 3.0
      az_max: 7.0
      iteration_count: 2
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.1
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      reset_period: 1.0 # (only in Humble)
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      TrajectoryValidator:
        plugin: "mppi::DefaultOptimalTrajectoryValidator"
        collision_lookahead_time: 2.0
        consider_footprint: false
      AckermannConstraints:
        min_turning_r: 0.2
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.8
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        # Heavily penalize reversing so the controller rotates in place and
        # drives forward whenever it can. Backward trajectories only win when
        # every forward/turning option collides (CostCritic dwarfs this weight),
        # i.e. when there's genuinely no room to turn around.
        cost_weight: 25.0
        threshold_to_consider: 0.5
      # ObstaclesCritic:
      #   enabled: true
      #   cost_power: 1
      #   repulsion_weight: 1.5
      #   critical_weight: 20.0
      #   consider_footprint: false
      #   collision_cost: 10000.0
      #   collision_margin_distance: 0.1
      #   near_goal_distance: 0.5
      #   inflation_radius: 0.55 # (only in Humble)
      #   cost_scaling_factor: 10.0 # (only in Humble)
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 8
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 12.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        # Was 1.0 -- far too weak next to PathFollowCritic (12.0), so heading
        # misalignment had almost no cost gradient and the robot arced forward
        # instead of turning. Raised so turning toward the path is rewarded.
        cost_weight: 2.5
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        # Was 1.0 rad: critic stayed inactive for any heading error under 57
        # deg, so moderate turns were never penalized. Back to ~nav2 default
        # (pi/4) so the robot starts correcting heading much earlier.
        max_angle_to_furthest: 0.6
        mode: 0

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.2
      use_astar: false
      # Fail planning immediately when the only route is blocked instead
      # of routing through unknown cells. A wall added to the SLAM map
      # mid-run then makes ComputePathToPose return FAILURE right away.
      allow_unknown: false

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 10.0           # Match controller frequency
      publish_frequency: 10.0
      transform_tolerance: 0.5
      # Absorb transient map->odom gaps when slam_toolbox's single-threaded
      # executor stalls under load (default 10 s is too tight).
      tf_buffer_duration: 30.0

      rolling_window: true
      width: 10                        # Expand for better lookahead at higher speeds
      height: 10
      resolution: 0.05

      footprint: "[[-0.30,-0.20],[-0.30,0.20],[0.40,0.20],[0.40,-0.20]]"

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          max_obstacle_height: 0.8
          min_obstacle_height: 0.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: false

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.25
        cost_scaling_factor: 20.0
        inflate_unknown: false
        inflate_around_unknown: true
      always_send_full_costmap: True
      introspection_mode: "disabled"

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[-0.3, -0.20], [-0.3, 0.20], [0.4, 0.20], [0.4, -0.20]]"
      footprint_padding: 0.03
      transform_tolerance: 0.5
      tf_buffer_duration: 30.0
      update_frequency: 2.0
      publish_frequency: 2.0
      resolution: 0.05
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        combination_method: 0  # Overwrite: lets raytracing clear stale static_layer walls (e.g. doors)
        observation_sources: scan
        scan:
          topic: /scan
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          # Must equal obstacle_max_range. If raytracing clears farther than
          # marking can re-mark, walls in the 2.5-6 m ring get cleared to FREE
          # but never re-marked, and Overwrite then erases them from the
          # static map -- the planner sees holes that aren't really there.
          raytrace_max_range: 2.5
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: false
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        enabled: true
        subscribe_to_updates: true
        transform_tolerance: 0.2
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.25
        cost_scaling_factor: 20.0
        inflate_unknown: false
        inflate_around_unknown: true
      always_send_full_costmap: True
      introspection_mode: "disabled"

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 10.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # Angular limits raised to match the controller. Was 2.0 rad/s, below
    # MPPI's wz_max (2.5), so every turn command was silently clipped 20%.
    max_velocity: [1.5, 0.0, 2.5]
    min_velocity: [-0.5, 0.0, -2.5]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    # Angular accel raised 3.0 -> 4.5 rad/s^2 so commanded turns ramp up
    # quickly instead of crawling toward the target rate. Well within a Go2's
    # in-place rotation capability.
    max_accel: [2.5, 0.0, 4.5]
    max_decel: [-2.5, 0.0, -4.5]
    odom_topic: odom
    odom_duration: 0.1
    use_realtime_priority: false
    enable_stamped_cmd_vel: false

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    default_nav_to_pose_bt_xml: $(find-pkg-share autonomy_2d)/config/custom_nav_to_pose_bt.xml
    default_nav_through_poses_bt_xml: $(find-pkg-share autonomy_2d)/config/custom_nav_through_pose_bt.xml